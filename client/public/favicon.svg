<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Obsidian Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="45%" stop-color="#070c1a" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Emerald M Gradient -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Tech Cyan G Gradient -->
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Team Accent Warm Spark -->
    <linearGradient id="teamSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Badge -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Subtle Internal Glow Accents -->
  <circle cx="180" cy="240" r="90" fill="#10b981" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="330" cy="250" r="100" fill="#0ea5e9" opacity="0.08" filter="url(#softGlow)" />

  <!-- Monogram: M & G Group -->
  <!-- "M" (Emerald) -->
  <path
    d="M 72 360
       L 72 152
       C 72 142 80 134 90 134
       L 114 134
       C 124 134 132 140 136 148
       L 172 238
       L 208 148
       C 212 140 220 134 230 134
       L 254 134
       C 264 134 272 142 272 152
       L 272 360
       C 272 370 264 378 254 378
       L 230 378
       C 220 378 212 370 212 360
       L 212 230
       L 186 292
       C 182 300 174 306 164 306
       C 154 306 146 300 142 292
       L 116 230
       L 116 360
       C 116 370 108 378 98 378
       L 90 378
       C 80 378 72 370 72 360 Z"
    fill="url(#mGrad)"
  />

  <!-- "G" (Tech Cyan with clean geometry) -->
  <path
    d="M 418 184
       C 426 192 426 204 418 212
       L 404 224
       C 396 230 384 228 378 220
       C 366 206 348 196 326 196
       C 286 196 256 226 256 264
       C 256 302 286 332 326 332
       C 350 332 370 320 380 302
       L 336 302
       C 324 302 316 294 316 282
       L 316 276
       C 316 264 324 256 336 256
       L 416 256
       C 426 256 434 264 434 274
       L 434 282
       C 434 336 388 378 326 378
       C 260 378 212 328 212 264
       C 212 200 260 150 326 150
       C 362 150 394 164 416 182
       Z"
    fill="url(#gGrad)"
  />

  <!-- High-Precision Team Network Baseline -->
  <g transform="translate(0, 0)">
    <!-- Circuit Base Line -->
    <rect x="176" y="416" width="160" height="4" rx="2" fill="rgba(255, 255, 255, 0.12)" />

    <!-- Left Node (M / Engineering) -->
    <circle cx="176" cy="418" r="8" fill="#10b981" />
    <circle cx="176" cy="418" r="3.5" fill="#ffffff" />

    <!-- Center Pulse (Team Spark) -->
    <circle cx="256" cy="418" r="10" fill="url(#teamSpark)" filter="url(#softGlow)" />
    <circle cx="256" cy="418" r="4.5" fill="#ffffff" />

    <!-- Right Node (G / Delivery) -->
    <circle cx="336" cy="418" r="8" fill="#0ea5e9" />
    <circle cx="336" cy="418" r="3.5" fill="#ffffff" />
  </g>
</svg>
